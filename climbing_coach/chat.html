<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climbing Coach</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Climbing Coach">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    :root {
      --bg: #0d0f14;
      --bg-elevated: #161923;
      --border: #262b3a;
      --text: #eef0f5;
      --text-dim: #8b90a3;
      --accent: #5b7cfa;
      --accent-2: #7c5bfa;
      --coach-bubble: #1a1e2b;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      overscroll-behavior-y: none;
    }
    #chat {
      padding: 16px 14px;
      padding-top: calc(56px + var(--safe-top));
      padding-bottom: calc(96px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .msg {
      margin: 6px 0;
      padding: 11px 15px;
      border-radius: 18px;
      max-width: 82%;
      line-height: 1.45;
      font-size: 15px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
      animation: msgIn 0.22s ease-out;
      word-wrap: break-word;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg p { margin: 0 0 8px 0; }
    .msg p:last-child { margin-bottom: 0; }
    .msg ul, .msg ol { margin: 4px 0; padding-left: 20px; }
    .msg code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 5px; font-size: 0.9em; }
    .msg strong { color: #fff; }
    .user {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }
    .coach {
      background: var(--coach-bubble);
      border: 1px solid var(--border);
      margin-right: auto;
      border-bottom-left-radius: 5px;
    }
    .typing { display: flex; align-items: center; gap: 4px; padding: 14px 16px; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-dim);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    #topBar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(10px + var(--safe-top)) 14px 10px;
      background: rgba(13, 15, 20, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    #title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    #topRight { display: flex; align-items: center; gap: 10px; }
    #lastSync { font-size: 11px; color: var(--text-dim); }
    #syncBtn {
      padding: 6px 13px; border-radius: 14px; border: 1px solid var(--border);
      background: var(--bg-elevated); color: var(--text); font-size: 13px;
      transition: opacity 0.15s ease;
    }
    #syncBtn:active { opacity: 0.7; }
    #syncBtn:disabled { opacity: 0.5; }
    #inputBar {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; gap: 8px;
      padding: 10px 12px calc(10px + var(--safe-bottom));
      background: linear-gradient(to top, var(--bg) 60%, transparent);
    }
    #msgInput {
      flex: 1; padding: 12px 16px; border-radius: 22px; border: 1px solid var(--border);
      background: var(--bg-elevated); color: var(--text); font-size: 16px; outline: none;
      transition: border-color 0.15s ease;
    }
    #msgInput:focus { border-color: var(--accent); }
    #msgInput::placeholder { color: var(--text-dim); }
    #sendBtn {
      padding: 12px 20px; border-radius: 22px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white; font-weight: 600; font-size: 15px;
      transition: transform 0.1s ease, opacity 0.1s ease;
    }
    #sendBtn:active { transform: scale(0.96); }
    #sendBtn:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div id="topBar">
    <span id="title">🧗 Climbing Coach</span>
    <div id="topRight">
      <span id="lastSync"></span>
      <button id="syncBtn">🔄 Synchroniser</button>
    </div>
  </div>
  <div id="chat"></div>
  <div id="inputBar">
    <input id="msgInput" placeholder="Écris à ton coach..." autocomplete="off" />
    <button id="sendBtn">Envoyer</button>
  </div>

<script>
let sessionId = null;
const chatEl = document.getElementById("chat");

function formatLastSync(iso) {
  if (!iso) return "Jamais synchronisé";
  const d = new Date(iso);
  return "Dernière sync : " + d.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function updateLastSync(iso) {
  document.getElementById("lastSync").textContent = formatLastSync(iso);
}

function addMsg(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  if (who === "coach") {
    div.innerHTML = marked.parse(text);
  } else {
    div.textContent = text;
  }
  chatEl.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

async function startSession() {
  const res = await fetch("/session/start", { method: "POST" });
  const data = await res.json();
  sessionId = data.session_id;
  updateLastSync(data.last_sync);
  addMsg(data.reply, "coach");
}

async function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, "user");
  input.value = "";
  const res = await fetch("/session/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, message: text })
  });
  const data = await res.json();
  addMsg(data.reply || data.error, "coach");
}

async function syncNow() {
  const btn = document.getElementById("syncBtn");
  btn.disabled = true;
  btn.textContent = "Synchronisation...";
  try {
    const res = await fetch("/session/sync", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId })
    });
    const data = await res.json();
    btn.textContent = res.ok ? "✅ Synchronisé" : "❌ Erreur";
    if (res.ok) updateLastSync(data.last_sync);
  } catch (e) {
    btn.textContent = "❌ Erreur";
  }
  setTimeout(() => {
    btn.textContent = "🔄 Synchroniser";
    btn.disabled = false;
  }, 2000);
}

document.getElementById("syncBtn").onclick = syncNow;
document.getElementById("sendBtn").onclick = sendMessage;
document.getElementById("msgInput").addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}

startSession();
</script>
</body>
</html>
