      <input id="profilePathInput" value="C:\Users\Franc\OneDrive\Documents\GitHub\test_arkose\database\franck.json" placeholder="Chemin de sauvegarde du profil" />
      <button id="saveProfileBtn">💾 Enregistrer le profil</button>

<script>
let sessionId = null;
const chatEl = document.getElementById("chat");

function formatLastSync(iso) {
  if (!iso) return "Jamais synchronisé";
  const d = new Date(iso);
  return "Dernière sync : " + d.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function updateLastSync(iso) {
  document.getElementById("lastSync").textContent = formatLastSync(iso);
}

function addMsg(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  if (who === "coach") {
    div.innerHTML = marked.parse(text);
  } else {
    div.textContent = text;
  }
  chatEl.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

function addTyping() {
  const div = document.createElement("div");
  div.className = "msg coach typing";
  div.innerHTML = "<span class='dot'></span><span class='dot'></span><span class='dot'></span>";
  chatEl.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

// Bumped every time a session (re)starts. In-flight streams from a
// superseded session (e.g. a mode switch that happened mid-stream) check
// this before touching the DOM so a stray late chunk can't land in the
// wrong conversation. activeAbortController lets us also cancel the actual
// in-flight fetch instead of just letting it dangle.
let sessionToken = 0;
let activeAbortController = null;

// Reads a streaming text/plain response, filling a coach bubble as chunks arrive.
// Renders plain text while streaming (partial markdown can produce broken HTML),
// then swaps to the fully rendered markdown once the stream closes.
async function streamIntoBubble(res, typingEl, myToken) {
  if (!res.ok || !res.body) throw new Error("bad response");

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let full = "";
  let msgDiv = null;

  while (true) {
    const { done, value } = await reader.read();
    if (myToken !== sessionToken) return; // superseded by a newer session/mode
    if (done) break;
    const chunk = decoder.decode(value, { stream: true });
    if (!chunk) continue;
    if (!msgDiv) {
      typingEl.remove();
      msgDiv = document.createElement("div");
      msgDiv.className = "msg coach";
      chatEl.appendChild(msgDiv);
    }
    full += chunk;
    msgDiv.textContent = full;
    window.scrollTo(0, document.body.scrollHeight);
  }

  if (msgDiv) {
    msgDiv.innerHTML = marked.parse(full);
  } else {
    typingEl.remove();
    addMsg("(réponse vide)", "coach");
  }
}

async function startSession() {
  const myToken = ++sessionToken;
  if (activeAbortController) activeAbortController.abort();
  const controller = new AbortController();
  activeAbortController = controller;

  const typingEl = addTyping();
  try {
    const res = await fetch("/session/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: currentMode }),
      signal: controller.signal
    });
    if (myToken !== sessionToken) return; // a newer session started while we awaited
    if (!res.ok) throw new Error("bad response");
    sessionId = res.headers.get("X-Session-Id");
    updateLastSync(res.headers.get("X-Last-Sync"));
    await streamIntoBubble(res, typingEl, myToken);
  } catch (e) {
    if (myToken !== sessionToken) return; // superseded — ignore the abort error
    typingEl.remove();
    addMsg("❌ Impossible de démarrer la session, réessaie.", "coach");
  }
}

// --- Mode selector (test the onboarding vs. coaching prompt) ---
let currentMode = "coaching";

function setMode(mode) {
  if (mode === currentMode) return;
  currentMode = mode;
  document.getElementById("modeCoachingBtn").classList.toggle("active", mode === "coaching");
  document.getElementById("modeOnboardingBtn").classList.toggle("active", mode === "onboarding");
  document.body.classList.toggle("onboarding-mode", mode === "onboarding");
  document.getElementById("onboardingSaveStatus").textContent = "";
  chatEl.innerHTML = "";
  startSession();
}

document.getElementById("modeCoachingBtn").onclick = () => setMode("coaching");
document.getElementById("modeOnboardingBtn").onclick = () => setMode("onboarding");

// After an onboarding conversation, extract the profile from the transcript
// and write it to whatever path the user typed in.
async function saveOnboardingProfile() {
  const input = document.getElementById("profilePathInput");
  const btn = document.getElementById("saveProfileBtn");
  const status = document.getElementById("onboardingSaveStatus");
  const path = input.value.trim();
  if (!path) {
    status.textContent = "⚠️ Indique un chemin de fichier";
    return;
  }
  if (!sessionId) {
    status.textContent = "⚠️ Session non démarrée";
    return;
  }
  btn.disabled = true;
  status.textContent = "Extraction du profil...";
  try {
    const res = await fetch("/session/onboarding/finish", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, profile_path: path })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "bad response");
    status.textContent = `✅ Profil enregistré → ${data.profile_path}`;
  } catch (e) {
    status.textContent = `❌ ${e.message}`;
  }
  btn.disabled = false;
}

document.getElementById("saveProfileBtn").onclick = saveOnboardingProfile;

async function sendMessage() {
  const input = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, "user");
  input.value = "";
  input.disabled = true;
  sendBtn.disabled = true;

  const myToken = sessionToken;
  const controller = new AbortController();
  activeAbortController = controller;

  const typingEl = addTyping();
  try {
    const res = await fetch("/session/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
      signal: controller.signal
    });
    await streamIntoBubble(res, typingEl, myToken);
    if (myToken === sessionToken) checkForNewPlans();
  } catch (e) {
    if (myToken !== sessionToken) return; // mode was switched mid-message — ignore
    typingEl.remove();
    addMsg("❌ Erreur de connexion, réessaie.", "coach");
  } finally {
    if (myToken === sessionToken) {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
      window.scrollTo(0, document.body.scrollHeight);
    }
  }
}

async function syncNow() {
  const btn = document.getElementById("syncBtn");
  btn.disabled = true;
  btn.textContent = "Synchronisation...";
  try {
    const res = await fetch("/session/sync", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId })
    });
    const data = await res.json();
    btn.textContent = res.ok ? "✅ Synchronisé" : "❌ Erreur";
    if (res.ok) updateLastSync(data.last_sync);
  } catch (e) {
    btn.textContent = "❌ Erreur";
  }
  setTimeout(() => {
    btn.textContent = "🔄 Synchroniser";
    btn.disabled = false;
  }, 2000);
}

document.getElementById("syncBtn").onclick = syncNow;
document.getElementById("sendBtn").onclick = sendMessage;
document.getElementById("msgInput").addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});

// --- Stats tab ---
let statsLoaded = false;

function gradeTableHtml(byGrade) {
  const entries = Object.entries(byGrade || {});
  if (!entries.length) return "<div class='statRow'><span>Aucune donnée</span></div>";
  return entries.map(([grade, count]) =>
    `<div class="statRow"><span>${grade}</span><span>${count}</span></div>`
  ).join("");
}

function renderStats(data) {
  const el = document.getElementById("statsView");
  el.innerHTML = `
    <div class="levelCard">
      <div class="label">Niveau actuel (redpoint)</div>
      <div class="value">${data.current_level || "Pas encore assez de données"}</div>
    </div>
    <div class="levelCard">
      <div class="label">Niveau actuel (flash)</div>
      <div class="value">${data.current_flash_level || "Pas encore assez de données"}</div>
    </div>
    <div class="levelCard">
      <div class="label">Total</div>
      <div class="value">${data.total_sends} envois · ${data.total_flashes} flashs</div>
    </div>
    <div class="levelCard">
      <div class="label">Répartition par niveau (envois)</div>
      ${gradeTableHtml(data.sends_by_grade)}
    </div>
    <div class="levelCard">
      <div class="label">Répartition par niveau (flashs)</div>
      ${gradeTableHtml(data.flashes_by_grade)}
    </div>
  `;
}

async function loadStats() {
  const el = document.getElementById("statsView");
  el.innerHTML = "<div id='statsEmpty'>Chargement...</div>";
  try {
    const res = await fetch(`/session/stats?session_id=${sessionId}`);
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    renderStats(data);
  } catch (e) {
    el.innerHTML = "<div id='statsEmpty'>❌ Impossible de charger les stats</div>";
  }
}

// --- Plan tab ---
function planItemHtml(item) {
  const meta = [];
  if (item.sets) meta.push(`${item.sets} séries`);
  if (item.reps) meta.push(item.reps);
  if (item.duration_min) meta.push(`${item.duration_min} min`);
  if (item.rest_sec) meta.push(`repos ${item.rest_sec}s`);
  return `<div class="planItem">
    <div>${item.name}</div>
    ${meta.length ? `<div class="meta">${meta.join(" · ")}</div>` : ""}
    ${item.notes ? `<div class="meta">${item.notes}</div>` : ""}
  </div>`;
}

function planSectionHtml(title, items) {
  if (!items || !items.length) return "";
  return `<div class="planBlock">
    <div class="blockTitle">${title}</div>
    ${items.map(planItemHtml).join("")}
  </div>`;
}

// A single séance, collapsed by default — expand to see warmup/blocks/cooldown.
function renderPlanCard(plan) {
  const summaryBits = [];
  if (plan.session_total) summaryBits.push(`Séance ${plan.session_index || "?"}/${plan.session_total}`);
  if (plan.total_duration_min) summaryBits.push(`${plan.total_duration_min} min`);
  return `
    <details class="planCard">
      <summary>
        <span class="chevron">▸</span>
        <div class="planCardTitle">
          <div class="value">${plan.title}</div>
          ${summaryBits.length ? `<div class="meta">${summaryBits.join(" · ")}</div>` : ""}
        </div>
        <button class="planDeleteBtn" data-plan-id="${plan.id}">✕</button>
      </summary>
      <div class="planCardBody">
        ${planSectionHtml("Échauffement", plan.warmup)}
        ${planSectionHtml("Séance", plan.blocks)}
        ${planSectionHtml("Retour au calme", plan.cooldown)}
      </div>
    </details>
  `;
}

// Séances sharing the same program_title (e.g. a 3-session build-up toward one
// project) are gathered under a single expandable group instead of listed flat.
function renderPlanGroup(programTitle, plans) {
  const sorted = [...plans].sort((a, b) => (a.session_index || 0) - (b.session_index || 0));
  return `
    <details class="planGroup" open>
      <summary>
        <span class="chevron">▸</span>
        <div class="planCardTitle">
          <div class="value">${programTitle}</div>
          <div class="meta">${plans.length} séance${plans.length > 1 ? "s" : ""}</div>
        </div>
      </summary>
      <div class="planGroupBody">
        ${sorted.map(renderPlanCard).join("")}
      </div>
    </details>
  `;
}

function renderPlan(plans) {
  const el = document.getElementById("planView");
  if (!plans || !plans.length) {
    el.innerHTML = "<div id='planEmpty'>Pas encore de séance proposée — parle d'un entraînement avec ton coach.</div>";
    return;
  }

  const groups = new Map(); // program_title -> plans[]
  const standalone = [];
  for (const p of plans) {
    if (p.program_title) {
      if (!groups.has(p.program_title)) groups.set(p.program_title, []);
      groups.get(p.program_title).push(p);
    } else {
      standalone.push(p);
    }
  }

  const latestOf = items => items.reduce((a, b) => (a.generated_at > b.generated_at ? a : b)).generated_at;
  const entries = [
    ...[...groups.entries()].map(([title, items]) => ({
      html: renderPlanGroup(title, items),
      sortKey: latestOf(items),
    })),
    ...standalone.map(p => ({ html: renderPlanCard(p), sortKey: p.generated_at })),
  ].sort((a, b) => (a.sortKey < b.sortKey ? 1 : -1));

  el.innerHTML = entries.map(e => e.html).join("");

  el.querySelectorAll(".planDeleteBtn").forEach(btn => {
    btn.onclick = (e) => {
      e.preventDefault(); // don't toggle the <details> open state
      deletePlan(btn.dataset.planId);
    };
  });
}

async function deletePlan(planId) {
  try {
    await fetch(`/session/plan/${planId}?session_id=${sessionId}`, { method: "DELETE" });
  } catch (e) {}
  loadPlan();
}

async function loadPlan() {
  const el = document.getElementById("planView");

  try {
    const res = await fetch(`/session/plan?session_id=${sessionId}`);

    const data = await res.json();
    renderPlan(data.plans);
  } catch (e) {
    el.innerHTML = "<div id='planEmpty'>❌ Impossible de charger le plan</div>";
  }
}

// --- Plan proposals (inline in chat) ---
const knownPlanIds = new Set();

// Plan extraction (maybe_generate_plan) is a full extra LLM call that runs as a
// background task after the chat reply has already streamed in, so it can easily
// take several seconds longer than the reply itself — keep polling for a while
// rather than giving up after one or two quick checks.
const PLAN_POLL_INTERVAL_MS = 2000;
const PLAN_POLL_MAX_ATTEMPTS = 20; // ~40s of coverage

async function checkForNewPlans(attempt = 0) {
  try {
    const res = await fetch(`/session/plan?session_id=${sessionId}`);
    if (res.ok) {
      const data = await res.json();
      const newPlans = (data.plans || []).filter(p => !knownPlanIds.has(p.id));
      if (newPlans.length) {
        newPlans.forEach(p => {
          knownPlanIds.add(p.id);
          addPlanProposal(p);
        });
        return;
      }
    }
  } catch (e) {}
  if (attempt < PLAN_POLL_MAX_ATTEMPTS) {
    setTimeout(() => checkForNewPlans(attempt + 1), PLAN_POLL_INTERVAL_MS);
  }
}

function addPlanProposal(plan) {
  const wrapper = document.createElement("div");
  wrapper.className = "msg coach planProposal";
  chatEl.appendChild(wrapper);
  renderProposalView(wrapper, plan);
  window.scrollTo(0, document.body.scrollHeight);
}

function renderProposalView(wrapper, plan) {
  const summaryBits = [];
  if (plan.session_total) summaryBits.push(`Séance ${plan.session_index || "?"}/${plan.session_total}`);
  if (plan.total_duration_min) summaryBits.push(`${plan.total_duration_min} min`);
  wrapper.innerHTML = `
    <div class="proposalHeader">📋 Nouveau plan proposé — tu en penses quoi ?</div>
    <div class="planCardTitle">
      <div class="value">${plan.title}</div>
      ${summaryBits.length ? `<div class="meta">${summaryBits.join(" · ")}</div>` : ""}
    </div>
    ${planSectionHtml("Échauffement", plan.warmup)}
    ${planSectionHtml("Séance", plan.blocks)}
    ${planSectionHtml("Retour au calme", plan.cooldown)}
    <div class="proposalActions">
      <button class="proposalBtn acceptBtn">✅ Accepter</button>
      <button class="proposalBtn editBtn">✏️ Modifier</button>
      <button class="proposalBtn rejectBtn">✕ Refuser</button>
    </div>
  `;
  wrapper.querySelector(".acceptBtn").onclick = () => {
    wrapper.innerHTML = `<div class="proposalHeader">✅ Plan « ${plan.title} » ajouté à ton programme — tu le retrouves dans l'onglet Plan.</div>`;
  };
  wrapper.querySelector(".editBtn").onclick = () => showPlanEditForm(wrapper, plan);
  wrapper.querySelector(".rejectBtn").onclick = () => rejectPlanProposal(wrapper, plan);
}

async function rejectPlanProposal(wrapper, plan) {
  wrapper.innerHTML = `<div class="proposalHeader">Suppression...</div>`;
  try {
    await fetch(`/session/plan/${plan.id}?session_id=${sessionId}`, { method: "DELETE" });
  } catch (e) {}
  wrapper.innerHTML = `<div class="proposalHeader">✕ Plan « ${plan.title} » refusé.</div>`;
}

function editableItemHtml(item) {
  const it = item || {};
  return `<div class="editItem">
    <input class="editName" value="${(it.name || "").replace(/"/g, "&quot;")}" placeholder="Nom de l'exercice" />
    <div class="editRow">
      <input class="editSets" type="number" value="${it.sets ?? ""}" placeholder="Séries" />
      <input class="editReps" value="${(it.reps || "").replace(/"/g, "&quot;")}" placeholder="Reps" />
      <input class="editDuration" type="number" value="${it.duration_min ?? ""}" placeholder="Min" />
      <input class="editRest" type="number" value="${it.rest_sec ?? ""}" placeholder="Repos (s)" />
    </div>
    <input class="editNotes" value="${(it.notes || "").replace(/"/g, "&quot;")}" placeholder="Notes" />
    <button class="removeItemBtn" type="button">🗑 Retirer</button>
  </div>`;
}

function editSectionHtml(section, title, items) {
  return `<div class="planBlock editSection" data-section="${section}">
    <div class="blockTitle">${title}</div>
    <div class="editItems">${(items || []).map(editableItemHtml).join("")}</div>
    <button class="addItemBtn" type="button" data-section="${section}">+ Ajouter un exercice</button>
  </div>`;
}

function wireEditItemRemoval(root) {
  root.querySelectorAll(".removeItemBtn").forEach(btn => {
    btn.onclick = () => btn.closest(".editItem").remove();
  });
}

function showPlanEditForm(wrapper, plan) {
  wrapper.innerHTML = `
    <div class="proposalHeader">✏️ Modifie le plan avant de l'accepter</div>
    <input class="editTitle" value="${plan.title.replace(/"/g, "&quot;")}" placeholder="Titre de la séance" />
    ${editSectionHtml("warmup", "Échauffement", plan.warmup)}
    ${editSectionHtml("blocks", "Séance", plan.blocks)}
    ${editSectionHtml("cooldown", "Retour au calme", plan.cooldown)}
    <div class="proposalActions">
      <button class="proposalBtn saveBtn">💾 Enregistrer et accepter</button>
      <button class="proposalBtn cancelBtn">Annuler</button>
    </div>
  `;
  wireEditItemRemoval(wrapper);
  wrapper.querySelectorAll(".addItemBtn").forEach(btn => {
    btn.onclick = () => {
      const section = btn.dataset.section;
      const container = wrapper.querySelector(`.editSection[data-section="${section}"] .editItems`);
      const div = document.createElement("div");
      div.innerHTML = editableItemHtml({});
      container.appendChild(div.firstElementChild);
      wireEditItemRemoval(container);
    };
  });
  wrapper.querySelector(".cancelBtn").onclick = () => renderProposalView(wrapper, plan);
  wrapper.querySelector(".saveBtn").onclick = () => savePlanEdits(wrapper, plan);
}

function collectEditSection(wrapper, section) {
  const items = [];
  wrapper.querySelectorAll(`.editSection[data-section="${section}"] .editItem`).forEach(itemEl => {
    const name = itemEl.querySelector(".editName").value.trim();
    if (!name) return;
    const sets = itemEl.querySelector(".editSets").value;
    const reps = itemEl.querySelector(".editReps").value.trim();
    const duration = itemEl.querySelector(".editDuration").value;
    const rest = itemEl.querySelector(".editRest").value;
    const notes = itemEl.querySelector(".editNotes").value.trim();
    items.push({
      name,
      sets: sets ? parseInt(sets, 10) : null,
      reps: reps || null,
      duration_min: duration ? parseInt(duration, 10) : null,
      rest_sec: rest ? parseInt(rest, 10) : null,
      notes,
    });
  });
  return items;
}

async function savePlanEdits(wrapper, plan) {
  const title = wrapper.querySelector(".editTitle").value.trim() || plan.title;
  const body = {
    title,
    warmup: collectEditSection(wrapper, "warmup"),
    blocks: collectEditSection(wrapper, "blocks"),
    cooldown: collectEditSection(wrapper, "cooldown"),
  };
  wrapper.innerHTML = `<div class="proposalHeader">Enregistrement...</div>`;
  try {
    const res = await fetch(`/session/plan/${plan.id}?session_id=${sessionId}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    wrapper.innerHTML = `<div class="proposalHeader">✅ Plan « ${data.plan.title} » modifié et ajouté à ton programme.</div>`;
  } catch (e) {
    wrapper.innerHTML = `<div class="proposalHeader">❌ Impossible d'enregistrer les modifications.</div>
      <div class="proposalActions"><button class="proposalBtn retryBtn">Réessayer</button></div>`;
    wrapper.querySelector(".retryBtn").onclick = () => showPlanEditForm(wrapper, plan);
  }
}

function splitList(str) {

function numOrNull(id) {
  const v = document.getElementById(id).value;
  return v === "" ? null : Number(v);
}

  return `<div class="injuryCard" data-idx="${idx}">

function collectProfileFromForm() {
  const injuries = injuriesState.map((_, idx) => {
    const card = document.querySelector(`.injuryCard[data-idx="${idx}"]`);
    return {
      description: card.querySelector(".inj-desc").value.trim(),
      active: card.querySelector(".inj-active").checked,
      avoid: splitList(card.querySelector(".inj-avoid").value),
    };
  }).filter(i => i.description);

  return {
    ...currentProfileRaw,
    age: numOrNull("pf_age"),
    height_cm: numOrNull("pf_height_cm"),
    wingspan_cm: numOrNull("pf_wingspan_cm"),
    weight_kg: numOrNull("pf_weight_kg"),
    years_climbing: numOrNull("pf_years_climbing"),
    started_at_level: document.getElementById("pf_started_at_level").value.trim(),
    current_redpoint_grade_fr: document.getElementById("pf_current_redpoint_grade_fr").value.trim(),
    current_flash_grade_fr: document.getElementById("pf_current_flash_grade_fr").value.trim(),
    preferred_styles: splitList(document.getElementById("pf_preferred_styles").value),
    self_strengths: splitList(document.getElementById("pf_self_strengths").value),
    self_weaknesses: splitList(document.getElementById("pf_self_weaknesses").value),
    gym_sessions_per_week: numOrNull("pf_gym_sessions_per_week"),
    typical_session_duration_min: numOrNull("pf_typical_session_duration_min"),
    other_activities: splitList(document.getElementById("pf_other_activities").value),
    home_setup: splitList(document.getElementById("pf_home_setup").value),
    injuries: injuries,
    short_term_goals: splitList(document.getElementById("pf_short_term_goals").value),
    long_term_goals: splitList(document.getElementById("pf_long_term_goals").value),
    coach_tone: document.getElementById("pf_coach_tone").value,
    coach_language: document.getElementById("pf_coach_language").value,
    focus_preference: document.getElementById("pf_focus_preference").value,
    notes: document.getElementById("pf_notes").value,
  };
}

async function saveProfile() {
  const btn = document.getElementById("profileSaveBtn");
  const status = document.getElementById("profileSaveStatus");
  btn.disabled = true;
  status.textContent = "Enregistrement...";
  try {
    const updated = collectProfileFromForm();
    const res = await fetch("/session/profile", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, profile: updated })
    });
    if (!res.ok) throw new Error("bad response");
    currentProfileRaw = updated;
    status.textContent = "✅ Profil enregistré";
  } catch (e) {
    status.textContent = "❌ Erreur lors de l'enregistrement";
  }
  btn.disabled = false;
  setTimeout(() => { status.textContent = ""; }, 2500);
}

async function loadProfile() {
  const el = document.getElementById("profileView");
  el.innerHTML = "<div id='profileEmpty'>Chargement...</div>";
  try {
    const res = await fetch(`/session/profile?session_id=${sessionId}`);
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    currentProfileRaw = data;
    renderProfileForm(data);
  } catch (e) {
    el.innerHTML = "<div id='profileEmpty'>❌ Impossible de charger le profil</div>";
  }
}

function showTab(tab) {
  const chatEl2 = document.getElementById("chat");
  const statsEl = document.getElementById("statsView");
  const planEl = document.getElementById("planView");
  const profileEl = document.getElementById("profileView");
  const inputBar = document.getElementById("inputBar");
  document.getElementById("tabChat").classList.toggle("active", tab === "chat");
  document.getElementById("tabStats").classList.toggle("active", tab === "stats");
  document.getElementById("tabPlan").classList.toggle("active", tab === "plan");
  document.getElementById("tabProfile").classList.toggle("active", tab === "profile");

  chatEl2.style.display = tab === "chat" ? "block" : "none";
  inputBar.style.display = tab === "chat" ? "flex" : "none";
  statsEl.style.display = tab === "stats" ? "block" : "none";
  planEl.style.display = tab === "plan" ? "block" : "none";
  profileEl.style.display = tab === "profile" ? "block" : "none";

  if (tab === "stats") loadStats();
  if (tab === "plan") loadPlan();
  if (tab === "profile") loadProfile();
}

document.getElementById("tabChat").onclick = () => showTab("chat");
document.getElementById("tabStats").onclick = () => showTab("stats");
document.getElementById("tabPlan").onclick = () => showTab("plan");
document.getElementById("tabProfile").onclick = () => showTab("profile");

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}

startSession();
</script>
