<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climbing Coach</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Climbing Coach">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; padding: 0; background: #111; color: #eee; }
    #chat { padding: 12px; padding-bottom: 90px; }
    .msg { margin: 8px 0; padding: 10px 14px; border-radius: 14px; max-width: 80%; line-height: 1.4; }
    .msg p { margin: 0 0 8px 0; }
    .msg p:last-child { margin-bottom: 0; }
    .msg ul, .msg ol { margin: 4px 0; padding-left: 20px; }
    .msg strong { color: #fff; }
    .user { background: #2563eb; margin-left: auto; }
    .coach { background: #2a2a2a; }
    .coach.typing { display: flex; gap: 4px; align-items: center; padding: 14px; }
    .coach.typing .dot { width: 6px; height: 6px; border-radius: 50%; background: #888; animation: bounce 1.2s infinite; }
    .coach.typing .dot:nth-child(2) { animation-delay: 0.15s; }
    .coach.typing .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }
    #inputBar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; padding: 10px; background: #111; }
    #msgInput { flex: 1; padding: 12px; border-radius: 20px; border: none; font-size: 16px; }
    #sendBtn { margin-left: 8px; padding: 12px 18px; border-radius: 20px; border: none; background: #2563eb; color: white; }
    #topBar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: flex-end; padding: 8px 12px; background: #111; z-index: 10; }
    #syncBtn { padding: 6px 12px; border-radius: 14px; border: none; background: #2a2a2a; color: #eee; font-size: 13px; }
    #syncBtn:disabled { opacity: 0.5; }
    #chat { padding-top: 48px; }
    #lastSync { font-size: 12px; color: #888; margin-right: 10px; align-self: center; }

    #topBar { justify-content: space-between; align-items: center; }
    #tabs { display: flex; gap: 4px; }
    .tabBtn { padding: 6px 14px; border-radius: 14px; border: none; background: transparent; color: #888; font-size: 14px; }
    .tabBtn.active { background: #2a2a2a; color: #eee; }
    #topBarRight { display: flex; align-items: center; }

    #statsView { display: none; padding: 60px 16px 90px; }
    .levelCard { background: #2a2a2a; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .levelCard .label { font-size: 13px; color: #888; margin-bottom: 4px; }
    .levelCard .value { font-size: 20px; font-weight: 600; }
    .statRow { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 14px; }
    .statRow:last-child { border-bottom: none; }
    #statsEmpty { color: #888; text-align: center; margin-top: 40px; }

    #planView { display: none; padding: 60px 16px 90px; }
    #planEmpty { color: #888; text-align: center; margin-top: 40px; }
    .planBlock { background: #2a2a2a; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .planBlock .blockTitle { font-size: 14px; color: #888; margin-bottom: 8px; text-transform: uppercase; }
    .planItem { padding: 8px 0; border-bottom: 1px solid #222; font-size: 15px; }
    .planItem:last-child { border-bottom: none; }
    .planItem .meta { color: #888; font-size: 12px; margin-top: 2px; }
  </style>
</head>
<body>
  <div id="topBar">
    <div id="tabs">
      <button class="tabBtn active" id="tabChat">Chat</button>
      <button class="tabBtn" id="tabStats">Stats</button>
      <button class="tabBtn" id="tabPlan">Plan</button>
    </div>
    <div id="topBarRight">
      <span id="lastSync"></span>
      <button id="syncBtn">🔄 Synchroniser</button>
    </div>
  </div>
  <div id="chat"></div>
  <div id="statsView">
    <div id="statsEmpty">Chargement...</div>
  </div>
  <div id="planView">
    <div id="planEmpty">Chargement...</div>
  </div>
  <div id="inputBar">
    <input id="msgInput" placeholder="Écris à ton coach..." />
    <button id="sendBtn">Envoyer</button>
  </div>

<script>
let sessionId = null;
const chatEl = document.getElementById("chat");

function formatLastSync(iso) {
  if (!iso) return "Jamais synchronisé";
  const d = new Date(iso);
  return "Dernière sync : " + d.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function updateLastSync(iso) {
  document.getElementById("lastSync").textContent = formatLastSync(iso);
}

function addMsg(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  if (who === "coach") {
    div.innerHTML = marked.parse(text);
  } else {
    div.textContent = text;
  }
  chatEl.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

function addTyping() {
  const div = document.createElement("div");
  div.className = "msg coach typing";
  div.innerHTML = "<span class='dot'></span><span class='dot'></span><span class='dot'></span>";
  chatEl.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

// Reads a streaming text/plain response, filling a coach bubble as chunks arrive.
// Renders plain text while streaming (partial markdown can produce broken HTML),
// then swaps to the fully rendered markdown once the stream closes.
async function streamIntoBubble(res, typingEl) {
  if (!res.ok || !res.body) throw new Error("bad response");

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let full = "";
  let msgDiv = null;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const chunk = decoder.decode(value, { stream: true });
    if (!chunk) continue;
    if (!msgDiv) {
      typingEl.remove();
      msgDiv = document.createElement("div");
      msgDiv.className = "msg coach";
      chatEl.appendChild(msgDiv);
    }
    full += chunk;
    msgDiv.textContent = full;
    window.scrollTo(0, document.body.scrollHeight);
  }

  if (msgDiv) {
    msgDiv.innerHTML = marked.parse(full);
  } else {
    typingEl.remove();
    addMsg("(réponse vide)", "coach");
  }
}

async function startSession() {
  const typingEl = addTyping();
  try {
    const res = await fetch("/session/start", { method: "POST" });
    if (!res.ok) throw new Error("bad response");
    sessionId = res.headers.get("X-Session-Id");
    updateLastSync(res.headers.get("X-Last-Sync"));
    await streamIntoBubble(res, typingEl);
  } catch (e) {
    typingEl.remove();
    addMsg("❌ Impossible de démarrer la session, réessaie.", "coach");
  }
}

async function sendMessage() {
  const input = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, "user");
  input.value = "";
  input.disabled = true;
  sendBtn.disabled = true;

  const typingEl = addTyping();
  try {
    const res = await fetch("/session/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text })
    });
    await streamIntoBubble(res, typingEl);
  } catch (e) {
    typingEl.remove();
    addMsg("❌ Erreur de connexion, réessaie.", "coach");
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
    window.scrollTo(0, document.body.scrollHeight);
  }
}

async function syncNow() {
  const btn = document.getElementById("syncBtn");
  btn.disabled = true;
  btn.textContent = "Synchronisation...";
  try {
    const res = await fetch("/session/sync", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId })
    });
    const data = await res.json();
    btn.textContent = res.ok ? "✅ Synchronisé" : "❌ Erreur";
    if (res.ok) updateLastSync(data.last_sync);
  } catch (e) {
    btn.textContent = "❌ Erreur";
  }
  setTimeout(() => {
    btn.textContent = "🔄 Synchroniser";
    btn.disabled = false;
  }, 2000);
}

document.getElementById("syncBtn").onclick = syncNow;
document.getElementById("sendBtn").onclick = sendMessage;
document.getElementById("msgInput").addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});

// --- Stats tab ---
let statsLoaded = false;

function gradeTableHtml(byGrade) {
  const entries = Object.entries(byGrade || {});
  if (!entries.length) return "<div class='statRow'><span>Aucune donnée</span></div>";
  return entries.map(([grade, count]) =>
    `<div class="statRow"><span>${grade}</span><span>${count}</span></div>`
  ).join("");
}

function renderStats(data) {
  const el = document.getElementById("statsView");
  el.innerHTML = `
    <div class="levelCard">
      <div class="label">Niveau actuel (redpoint)</div>
      <div class="value">${data.current_level || "Pas encore assez de données"}</div>
    </div>
    <div class="levelCard">
      <div class="label">Niveau actuel (flash)</div>
      <div class="value">${data.current_flash_level || "Pas encore assez de données"}</div>
    </div>
    <div class="levelCard">
      <div class="label">Total</div>
      <div class="value">${data.total_sends} envois · ${data.total_flashes} flashs</div>
    </div>
    <div class="levelCard">
      <div class="label">Répartition par niveau (envois)</div>
      ${gradeTableHtml(data.sends_by_grade)}
    </div>
    <div class="levelCard">
      <div class="label">Répartition par niveau (flashs)</div>
      ${gradeTableHtml(data.flashes_by_grade)}
    </div>
  `;
}

async function loadStats() {
  const el = document.getElementById("statsView");
  el.innerHTML = "<div id='statsEmpty'>Chargement...</div>";
  try {
    const res = await fetch(`/session/stats?session_id=${sessionId}`);
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    renderStats(data);
  } catch (e) {
    el.innerHTML = "<div id='statsEmpty'>❌ Impossible de charger les stats</div>";
  }
}

// --- Plan tab ---
function planItemHtml(item) {
  const meta = [];
  if (item.sets) meta.push(`${item.sets} séries`);
  if (item.reps) meta.push(item.reps);
  if (item.duration_min) meta.push(`${item.duration_min} min`);
  if (item.rest_sec) meta.push(`repos ${item.rest_sec}s`);
  return `<div class="planItem">
    <div>${item.name}</div>
    ${meta.length ? `<div class="meta">${meta.join(" · ")}</div>` : ""}
    ${item.notes ? `<div class="meta">${item.notes}</div>` : ""}
  </div>`;
}

function planSectionHtml(title, items) {
  if (!items || !items.length) return "";
  return `<div class="planBlock">
    <div class="blockTitle">${title}</div>
    ${items.map(planItemHtml).join("")}
  </div>`;
}

function renderPlan(plan) {
  const el = document.getElementById("planView");
  if (!plan) {
    el.innerHTML = "<div id='planEmpty'>Pas encore de séance proposée — parle d'un entraînement avec ton coach.</div>";
    return;
  }
  el.innerHTML = `
    <div class="levelCard">
      <div class="label">${plan.title}</div>
      <div class="value">${plan.total_duration_min ? plan.total_duration_min + " min" : ""}</div>
    </div>
    ${planSectionHtml("Échauffement", plan.warmup)}
    ${planSectionHtml("Séance", plan.blocks)}
    ${planSectionHtml("Retour au calme", plan.cooldown)}
  `;
}

async function loadPlan() {
  const el = document.getElementById("planView");
  el.innerHTML = "<div id='planEmpty'>Chargement...</div>";
  try {
    const res = await fetch(`/session/plan?session_id=${sessionId}`);
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    renderPlan(data.plan);
  } catch (e) {
    el.innerHTML = "<div id='planEmpty'>❌ Impossible de charger le plan</div>";
  }
}

function showTab(tab) {
  const chatEl2 = document.getElementById("chat");
  const statsEl = document.getElementById("statsView");
  const planEl = document.getElementById("planView");
  const inputBar = document.getElementById("inputBar");
  document.getElementById("tabChat").classList.toggle("active", tab === "chat");
  document.getElementById("tabStats").classList.toggle("active", tab === "stats");
  document.getElementById("tabPlan").classList.toggle("active", tab === "plan");

  chatEl2.style.display = tab === "chat" ? "block" : "none";
  inputBar.style.display = tab === "chat" ? "flex" : "none";
  statsEl.style.display = tab === "stats" ? "block" : "none";
  planEl.style.display = tab === "plan" ? "block" : "none";

  if (tab === "stats") loadStats();
  if (tab === "plan") loadPlan();
}

document.getElementById("tabChat").onclick = () => showTab("chat");
document.getElementById("tabStats").onclick = () => showTab("stats");
document.getElementById("tabPlan").onclick = () => showTab("plan");

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}

startSession();
</script>
</body>
</html>
